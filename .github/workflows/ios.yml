name: Build iOS (unsigned)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
      - name: Audit puzzle logic and answer keys
        run: npm run audit:puzzles

      - name: Build Web app
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Validate Brain Quest branding source files
        run: |
          test -f assets/icon.png
          test -f assets/splash.png
          file assets/icon.png assets/splash.png

      - name: Generate iOS app icons and splash assets
        run: npx capacitor-assets generate --ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Read app version
        run: echo "APP_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload unsigned .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Brain-Quest-v${{ env.APP_VERSION }}-iOS-unsigned-app
          path: build/DerivedData/Build/Products/Release-iphoneos/App.app
          if-no-files-found: error
          retention-days: 14
